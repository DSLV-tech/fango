<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a120c">
  <title>Fango · volante</title>
  <style>
    :root { --bg: #1a120c; --ink: #fbefd9; --dim: #c9b393; --btn: #2e2018; --line: #5a4030; --warm: #ffb03a; --c: #ffb03a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
      font: 16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    button, input { font: inherit; color: inherit; }
    [hidden] { display: none !important; }

    #join { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; text-align: center; overflow: auto; touch-action: pan-y; }
    #join > :first-child { margin-top: auto; } #join > :last-child { margin-bottom: auto; }
    #join h1 { margin: 0; font-size: 30px; font-style: italic; font-weight: 900; color: var(--warm); }
    #join p { margin: 0; color: var(--dim); max-width: 36ch; }
    #join form { display: grid; gap: 10px; justify-items: center; }
    #join label { display: grid; gap: 4px; font-size: 14px; color: var(--dim); }
    #join input { padding: 10px 12px; text-align: center; background: var(--btn); border: 2px solid var(--line); border-radius: 10px; -webkit-user-select: text; user-select: text; }
    #codein { width: 7.5ch; font: 700 26px/1 ui-monospace, monospace !important; letter-spacing: .2em; text-transform: uppercase; }
    #namein { width: 14ch; font-size: 20px !important; }
    #join button { padding: 12px 28px; border: 0; border-radius: 10px; background: var(--warm); color: #2a1600; font-weight: 800; font-size: 18px; }
    #joinmsg { color: #ff9a7a !important; min-height: 1.3em; }

    #pad { position: fixed; inset: 0; background: radial-gradient(circle at 50% 0, color-mix(in srgb, var(--c) 28%, transparent), transparent 60%); }
    .top { position: absolute; left: 50%; top: max(8px, env(safe-area-inset-top)); transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; z-index: 3; width: 46%; text-align: center; pointer-events: none; }
    .who { display: flex; gap: 8px; align-items: center; font-weight: 800; font-size: 18px; }
    .who i { width: 26px; height: 16px; border-radius: 4px; background: var(--c); }
    #hud { font-size: 14px; color: var(--dim); }
    #state { font-size: 12px; color: var(--dim); display: flex; gap: 6px; align-items: baseline; }
    #state i { width: 8px; height: 8px; border-radius: 50%; background: var(--warm); }
    #state.on i { background: #7ad38a; }
    #startb { pointer-events: auto; margin-top: 4px; padding: 8px 20px; border-radius: 20px; border: 2px solid var(--c); background: var(--btn); font-weight: 800; letter-spacing: .05em; }

    /* sterzo: metà sinistra, il pollice scorre tra ◀ e ▶ */
    #steer { position: absolute; left: 0; top: 0; bottom: 0; width: 52%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      padding: 90px 10px max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    #steer div { border-radius: 22px; border: 3px solid var(--line); background: var(--btn); display: grid; place-content: center; font-size: 46px; color: var(--dim); }
    #steer div.on { border-color: var(--c); color: var(--ink); background: color-mix(in srgb, var(--c) 30%, var(--btn)); }
    .right { position: absolute; right: 0; top: 0; bottom: 0; width: 46%; display: grid; grid-template-rows: 1fr 1.6fr; gap: 10px;
      padding: 90px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) 10px; }
    .right button { border-radius: 22px; border: 3px solid var(--line); background: var(--btn); font-weight: 900; font-style: italic; font-size: 26px; letter-spacing: .04em; }
    #gas { border-color: var(--c) !important; font-size: 34px !important; }
    #nitro { color: #7fe0ff; }
    .right button.on { background: color-mix(in srgb, var(--c) 35%, var(--btn)); transform: scale(.97); }
    #turn { position: fixed; inset: 0; display: none; place-content: center; text-align: center; background: var(--bg); z-index: 5; color: var(--dim); padding: 16px; font-size: 20px; }
    @media (orientation: portrait) { #pad:not([hidden]) ~ #turn { display: grid; } }
  </style>
</head>
<body>
  <section id="join">
    <h1>FANGO</h1>
    <p>Scrivi il codice che vedi sulla TV e il tuo nome.</p>
    <form>
      <label>Codice <input id="codein" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD"></label>
      <label>Nome <input id="namein" maxlength="12" autocomplete="nickname" placeholder="Pilota"></label>
      <button>Entra</button>
    </form>
    <p id="joinmsg"></p>
  </section>

  <section id="pad" hidden>
    <div class="top">
      <div class="who"><i></i><span id="me">…</span></div>
      <div id="hud"></div>
      <div id="state"><i></i><span></span></div>
      <button id="startb" data-k>START</button>
    </div>
    <div id="steer"><div data-dir="-1">◀</div><div data-dir="1">▶</div></div>
    <div class="right">
      <button id="nitro" data-key="n">NITRO</button>
      <button id="gas" data-key="g">GAS</button>
    </div>
  </section>
  <div id="turn">Gira il telefono in orizzontale ⟲</div>

  <script src="vendor/peerjs.min.js"></script>
  <script src="pad.js"></script>
</body>
</html>
